# SimBridge R0 spike: build this app, run it in an iOS simulator on a GitHub
# Mac, and stream it to a Windows PC through a Cloudflare quick tunnel, to
# measure whether that is fast enough to use.
#
# Added by SimBridge for a one-off experiment. It does not change the app and
# can be deleted afterwards. It runs only when started by hand, needs the
# repository secret R0_SPIKE_KEY (it stops in its first step without it), and
# costs macOS runner time (free while this repo is public).
# Guide: https://github.com/MustafaDilawarKhan/simbridge/blob/archive/r0-spike-code/spikes/r0/README.md
name: SimBridge R0 spike

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes the session stays up after the tunnel is ready (1 to 30)
        required: true
        default: '15'
        type: string
      device:
        description: Simulator model (the job prints the ones available)
        required: true
        default: iPhone 17 Pro
        type: string
      tools_ref:
        description: Branch or commit of the SimBridge spike tools
        required: true
        default: archive/r0-spike-code
        type: string

permissions:
  contents: read
  actions: read # only to read when this run was dispatched, for the timing table

concurrency:
  group: simbridge-r0
  cancel-in-progress: false

jobs:
  spike:
    name: Build, boot, stream, tunnel
    runs-on: macos-latest
    # Backstop only: the session itself ends after `minutes` (max 30).
    timeout-minutes: 60
    env:
      SERVE_SIM_VERSION: '0.1.49'
      CLOUDFLARED_VERSION: '2026.11.0'
      BUN_VERSION: '1.4.4'
      GATEWAY_PORT: '8080'
      APP: ${{ github.workspace }}/app
      TOOLS: ${{ github.workspace }}/simbridge/spikes/r0
      # The app's .env turns this on; it would try to publish a server during the build.
      EXPO_UNSTABLE_DEPLOY_SERVER: '0'
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - name: Check the R0_SPIKE_KEY secret is set
        env:
          R0_SPIKE_KEY: ${{ secrets.R0_SPIKE_KEY }}
        run: |
          if [ -z "$R0_SPIKE_KEY" ]; then
            echo "::error title=R0_SPIKE_KEY is missing::Create the repository secret R0_SPIKE_KEY first. Stopping now, before any build, so the tunnel URL can never be printed in plain text."
            exit 1
          fi

      # The app and the SimBridge tools go into separate folders, so the app's
      # bundler never sees SimBridge's files.
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          path: app
          persist-credentials: false

      - name: Check out the SimBridge spike tools
        uses: actions/checkout@v7
        with:
          repository: MustafaDilawarKhan/simbridge
          ref: ${{ inputs.tools_ref }}
          path: simbridge
          persist-credentials: false

      - name: Check inputs and start the timing log
        env:
          MINUTES: ${{ inputs.minutes }}
          DEVICE: ${{ inputs.device }}
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [ "$MINUTES" -lt 1 ] || [ "$MINUTES" -gt 30 ]; then
            echo "::error::minutes must be a whole number from 1 to 30 (got '$MINUTES')"
            exit 1
          fi
          if ! [[ "$DEVICE" =~ ^[A-Za-z0-9\ ().-]+$ ]]; then
            echo "::error::device may only contain letters, digits, spaces and ( ) . -"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/r0"
          echo "STATE_DIR=$RUNNER_TEMP/r0" >> "$GITHUB_ENV"
          echo "TIMINGS=$RUNNER_TEMP/r0/timings.txt" >> "$GITHUB_ENV"
          export TIMINGS="$RUNNER_TEMP/r0/timings.txt"
          source "$TOOLS/runner/lib.sh"
          stamp job_start

      - name: Read when the run was dispatched
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          echo "dispatched $(node -e 'process.stdout.write(String(Date.parse(process.argv[1])))' "$created")" >> "$TIMINGS"

      - name: Show the Mac, Xcode and the available simulators
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcrun simctl list devices available

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simbridge/spikes/r0/package-lock.json

      - name: Set up Bun (the app's package manager)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install the app and spike tool packages
        run: |
          (cd "$APP" && bun install --frozen-lockfile)
          (cd "$TOOLS" && npm ci --no-audit --no-fund)
          source "$TOOLS/runner/lib.sh"
          stamp deps_installed

      - name: Generate the iOS project (expo prebuild, includes pod install)
        working-directory: app
        run: npx expo prebuild --platform ios

      - name: Build the app for the simulator (Release, JavaScript bundled in, no Metro)
        working-directory: app/ios
        run: |
          workspace="$(ls -d ./*.xcworkspace | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "Building scheme $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$STATE_DIR/build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          app="$(find "$STATE_DIR/build/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::xcodebuild finished but no .app was found"
            exit 1
          fi
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          echo "Built $app ($bundle_id, process $executable)"
          {
            echo "APP_PATH=$app"
            echo "BUNDLE_ID=$bundle_id"
            echo "APP_PROCESS=$executable"
          } >> "$GITHUB_ENV"
          source "$TOOLS/runner/lib.sh"
          stamp build_done

      # Done before the timed part, as an R1 session would have them ready.
      - name: Install cloudflared and serve-sim
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.tgz" \
            "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-darwin-arm64.tgz"
          shasum -a 256 "$RUNNER_TEMP/cloudflared.tgz"
          tar -xzf "$RUNNER_TEMP/cloudflared.tgz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/cloudflared" --version
          echo "CLOUDFLARED=$RUNNER_TEMP/cloudflared" >> "$GITHUB_ENV"
          npx --yes "serve-sim@$SERVE_SIM_VERSION" --version
          source "$TOOLS/runner/lib.sh"
          stamp tools_ready

      - name: Boot the simulator
        env:
          DEVICE: ${{ inputs.device }}
        run: |
          source "$TOOLS/runner/lib.sh"
          udid="$(node "$TOOLS/runner/resolve-device.mjs" "$DEVICE")"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          stamp boot_start
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # serve-sim's own CI opens the Simulator app after booting; do the same.
          open -ga Simulator || true
          stamp booted

      - name: Install and launch the app
        run: |
          source "$TOOLS/runner/lib.sh"
          xcrun simctl install "$UDID" "$APP_PATH"
          stamp installed
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          stamp launched

      - name: Run the session (serve-sim, gateway, tunnel, encrypted hand-off)
        env:
          R0_SPIKE_KEY: ${{ secrets.R0_SPIKE_KEY }}
          MINUTES: ${{ inputs.minutes }}
        run: bash "$TOOLS/runner/session.sh"

      - name: Make sure nothing is left running
        if: always()
        run: |
          pkill -f 'cloudflared tunnel' || true
          pkill -f 'gateway/gateway.mjs' || true
          xcrun simctl shutdown all || true
